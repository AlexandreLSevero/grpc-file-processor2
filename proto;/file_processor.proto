syntax = "proto3";
package file_processor;

option csharp_namespace = "FileProcessor";
option java_multiple_files = true;
option go_package = "fileprocessorpb";

// Chunk único de arquivo (streamed)
message FileChunk {
  bytes content = 1;
}

// Metadados iniciais enviados pelo cliente antes do stream de chunks (opcional)
message FileMeta {
  string file_name = 1;        // nome do arquivo original (ex: input.pdf)
  string mime_type = 2;        // tipo MIME (opcional, ex: application/pdf)
}

// Parâmetros específicos de cada operação
message CompressPDFParams {
  // vazio por enquanto; deixe para extensões (ex.: quality)
}

message ConvertToTXTParams {
  // opções futuras (ex.: language)
}

message ConvertImageFormatParams {
  string output_format = 1;    // ex: "png", "jpg", "webp"
}

message ResizeImageParams {
  int32 width = 1;
  int32 height = 2;
  // opcional: keep_aspect_ratio bool = 3;
}

// Envelope que acompanha o stream de upload (uma das duas formas)
message UploadRequest {
  oneof payload {
    FileMeta meta = 1;                // metadados iniciais
    FileChunk chunk = 2;              // pedaço de arquivo
    // (Podemos estender com mensagens de controle)
  }
}

// Envelope de resposta: stream de chunks ou um status final
message DownloadResponse {
  oneof payload {
    FileChunk chunk = 1;              // pedaço do arquivo processado
    StatusMessage status = 2;         // mensagem final (opcional)
  }
}

message StatusMessage {
  bool success = 1;
  string message = 2;
  string output_file_name = 3; // nome sugerido do arquivo de saída
}

// Serviço com métodos - todos usando streaming cliente->servidor e servidor->cliente
service FileProcessorService {
  // Cliente envia UploadRequest stream (meta + chunks). Servidor responde com stream (chunks do arquivo processado).
  rpc CompressPDF(stream UploadRequest) returns (stream DownloadResponse);
  rpc ConvertToTXT(stream UploadRequest) returns (stream DownloadResponse);
  rpc ConvertImageFormat(stream UploadRequest) returns (stream DownloadResponse);
  rpc ResizeImage(stream UploadRequest) returns (stream DownloadResponse);
}
