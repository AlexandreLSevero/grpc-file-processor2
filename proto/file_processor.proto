syntax = "proto3";

package file_processor;

message FileChunk {
  bytes content = 1;
}

message RequestChunk {
  oneof chunk_type {
    FileMetadata metadata = 1;
    FileChunk data = 2;
  }
}

message FileMetadata {
  string file_name = 1;
  oneof parameters {
    CompressPDFParams compress_pdf = 2;
    ConvertToTXTParams convert_to_txt = 3;
    ConvertImageFormatParams convert_image_format = 4;
    ResizeImageParams resize_image = 5;
  }
}

message CompressPDFParams {}
message ConvertToTXTParams {}
message ConvertImageFormatParams {
  string output_format = 1;  // ex: "png"
}
message ResizeImageParams {
  int32 width = 1;
  int32 height = 2;
}

message ResponseChunk {
  oneof chunk_type {
    StatusMessage status = 1;
    FileChunk data = 2;
  }
}

message StatusMessage {
  bool success = 1;
  string message = 2;
}

service FileProcessorService {
  rpc CompressPDF(stream RequestChunk) returns (stream ResponseChunk);
  rpc ConvertToTXT(stream RequestChunk) returns (stream ResponseChunk);
  rpc ConvertImageFormat(stream RequestChunk) returns (stream ResponseChunk);
  rpc ResizeImage(stream RequestChunk) returns (stream ResponseChunk);
}
